services:
  print-partner:
    image: ghcr.io/poitee/print-partner:latest
    # Fallback for building from source: docker compose up --build
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    # Reach host services (e.g. native Ollama) via host.docker.internal on Linux too.
    # Docker Desktop (Mac/Windows) already provides this; host-gateway is a no-op there.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      PRINT_PARTNER_DATA_DIR: "/data"
      STATIC_DIR: "/app/web/apps/web/dist"
      DEPLOY_MODE: "self-host"
      MULTI_USER: "${MULTI_USER:-0}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      # Optional: require API key for /api/v1 automation (slicers, scripts)
      # PRINT_PARTNER_API_KEY: "change-me-to-a-long-random-secret"
      # Optional: expose Swagger UI at /api/v1/docs in production (useful for integrations and MCP tool testing)
      # OPENAPI_UI: "1"
      # When Ollama runs on the host (not in Compose), set in Settings or here:
      # AI_PROVIDER: ollama
      # OLLAMA_URL: http://host.docker.internal:11434
    volumes:
      - print-partner-data:/data
    # Use user namespace to map container ppuser (1000) to host user
    # This allows non-root execution with proper file permissions
    user: "1000:1000"
    healthcheck:
      # node:22-bookworm-slim has no curl/wget; use node's built-in fetch.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  print-partner-data:
