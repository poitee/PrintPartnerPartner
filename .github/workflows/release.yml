name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for getsentry/action-release commit association.
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve Sentry release metadata
        id: sentry_meta
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
        run: |
          release="${{ steps.version.outputs.version }}-web"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Sentry upload skipped (SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT not fully configured)."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web workspace
        working-directory: web
        run: npm ci

      - name: Build web workspace (hidden source maps)
        working-directory: web
        env:
          VITE_SENTRY_RELEASE: ${{ steps.sentry_meta.outputs.release }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      - name: Create Sentry release and upload source maps
        if: steps.sentry_meta.outputs.enabled == 'true'
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
        with:
          environment: production
          release: ${{ steps.sentry_meta.outputs.release }}
          # Inject Debug IDs into the built JS before the image is packaged.
          sourcemaps: web/apps/web/dist
          set_commits: auto

      - name: Strip source maps from shipped SPA assets
        run: find web/apps/web/dist -type f -name '*.map' -delete

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PP_VERSION=${{ steps.version.outputs.version }}-web
            USE_PREBUILT_WEB=1
          tags: |
            ghcr.io/poitee/print-partner:latest
            ghcr.io/poitee/print-partner:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set GHCR package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh api --method PATCH \
            "/orgs/poitee/packages/container/print-partner/visibility" \
            -f visibility=public 2>/dev/null; then
            echo "Set org package visibility to public"
          else
            gh api --method PATCH \
              "/user/packages/container/print-partner/visibility" \
              -f visibility=public
            echo "Set user package visibility to public"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
