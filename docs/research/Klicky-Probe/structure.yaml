schema: print-partner/structure@1
source_name: Klicky-Probe
ref_documented: main
stl_root: null   # split by printer AND probe type
folders:
  - {path: Printers/Voron/v0/v0_STL, scope: "Voron-0"}
  - {path: Printers/Voron/Switchwire/SW_STL, scope: "Voron-Switchwire"}
  - {path: Printers/Voron/v1.8_v2.4_Legacy_Trident/v1.8_v2.4_Legacy_Trident_STL, scope: "Voron-2 / Voron-Trident / Voron-Legacy / V1.8"}
  - {path: Probes/KlickyProbe, scope: "standard microswitch probe body"}
  - {path: Probes/KlickyNG, scope: "next-gen enclosed-magnet probe"}
  - {path: Probes/Unklicky, scope: "self-built switch variant"}
  - {path: Probes/UnklickyNG, scope: "self-built NG variant"}
  - {path: Klipper_macros/, scope: "required config: klicky-probe.cfg, klicky-macros.cfg, klicky-variables.cfg, QGL/z-tilt/bed-mesh helpers"}
  - {path: Printers/Ratrig | Printers/Tiny-M | Printers/ZeroG, scope: "non-Voron; out of scope for Voron stacks"}
option_groups:
  - {id: probe_flavor, choose_one: [KlickyProbe, KlickyNG, Unklicky, UnklickyNG]}
  - {id: printer_mount_set, choose_one: [v0_STL, SW_STL, v1.8_v2.4_Legacy_Trident_STL], note: "match to base kit"}
naming_quirks:
  - "printer folder name 'v1.8_v2.4_Legacy_Trident' covers four bases"
  - "STL folders suffixed _STL; per-folder Usermods/ and Photos/"
known_overlaps:
  - {with: Micron, note: "Micron ships its own [a]_klicky_gantry_dock.stl in STLs/Gantry — use Micron's dock, Klicky's probe"}
  - {with: Voron-Tap / Boop, note: "same functional slot"}
