schema: print-partner/structure@1
source_name: Voron-Trident
ref_documented: main (also VTr2 diff noted)
stl_root: STLs/
folders:
  - {path: STLs/Gantry/ba_drive_units, required: true}
  - {path: STLs/Gantry/Front_Idlers, required: true}
  - {path: STLs/Gantry/X_Axis, required: true, note: "contains XY_Joints and X_Carriage (SB carriage lives here, not in the Stealthburner repo)"}
  - {path: STLs/Z_Assembly, required: true, note: "2hole/3hole variants inside"}
  - {path: STLs/Panels, required: true}
  - {path: STLs/Skirt, required: true, note: "size subfolders 250/ 300/ 350/"}
  - {path: STLs/electronics_bay, required: true, note: "lowercase dir name; controller_mounts and other_ps_mounts subfolders"}
  - {path: STLs/spool_holder, required: false}
  - {path: STLs/Tools, required: false, note: "jigs/guides, not printer parts"}
  - {path: STLs/Panels/Front_Doors, required: true}
  - {path: STLs/superseded_parts, required: false, note: "do NOT include in manifests (old exhaust_filter, old panel clips, chain anchors)"}
  - {path: experimental/horiz_chain_umb, required: false, note: "main only, not in VTr2"}
option_groups:
  - id: z_chain_hole_count
    choose_one: [STLs/Z_Assembly/z_lower_2hole.stl, STLs/Z_Assembly/z_lower_3hole.stl]
    paired_with: [STLs/Z_Assembly/z_rear_insert_2hole.stl, STLs/Z_Assembly/z_rear_insert_3hole.stl]
    note: "must match Stealthburner chain_anchor_2hole/3hole choice"
  - id: skirt_size
    choose_one: [STLs/Skirt/250, STLs/Skirt/300, STLs/Skirt/350]
  - id: rear_skirt_power
    choose_one: [STLs/Skirt/rear_skirt_power_adamstech.stl, STLs/Skirt/rear_skirt_power_filtered.stl, STLs/Skirt/rear_skirt_keystone.stl]
naming_quirks:
  - "[a]_ prefix = accent color part"
  - "_xN suffix = print quantity"
  - "mixed dir case: electronics_bay / spool_holder lowercase vs Gantry/Panels capitalized"
  - "STLs/readme.md lowercase filename"
tag_diffs:
  VTr2_vs_main:
    - "main consolidates panel clips: corner_panel_clip_6mm_x16.stl / midspan_panel_clip_6mm_x15.stl; VTr2 still has 4mm+6mm variants (corner_panel_clip_4mm_x8 / 6mm_x8, midspan 4mm_x7 / 6mm_x8)"
    - "4mm clips moved to STLs/superseded_parts/panels/ on main"
    - "experimental/horiz_chain_umb only on main"
  VTr1: "different STL top level: ElectronicsBay, Exhaust_Filter, Spool_Management (Afterburner era) — selections do not carry over to VTr2/main"
known_overlaps:
  - {with: Voron-2, paths: "Tools/MGN12_rail_guide_x2.stl, Tools/MGN9_rail_guide_x2.stl, electronics_bay parts (pcb_din_clip_x3, raspberrypi_bracket, rs25_psu_bracket, psu_stabilizer_50mm) share names"}
  - {with: LDOVoronTrident, paths: "LDO parts replace: rear_skirt_power_adamstech (-> power_inlet_1.2mm), deck wire covers"}
