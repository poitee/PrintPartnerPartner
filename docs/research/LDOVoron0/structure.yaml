schema: print-partner/structure@1
source_name: LDOVoron0
ref_documented: v02r1
stl_root: STLs/
folders:
  - {path: STLs/DIN_Mounts, required: false}
  - {path: STLs/Detachable_Spool_Holder, required: false}
  - {path: STLs/Kirigami, required: false, note: "Stealth_Bed_Main_Body.stl + [c]_Stealth_Bed_Diffuser.stl for Kirigami bed"}
  - {path: STLs/Mornsun_PSU_Cover, required: true, note: "README: 'Highly recommended to prevents accidental shocks'"}
  - {path: STLs/Name_Plate, required: false}
  - {path: STLs/Picobilical_Toolhead, required: false, note: "strain relief parts for LDO-Picobilical option"}
  - {path: STLs/Power_Inlet, required: true, note: "replaces stock V0.2 inlet foot for LDO 1.2mm AC inlet"}
  - {path: STLs/Preset_Print_PlatesR1, required: false, note: "pre-plated 250mm build plates combining Voron+LDO parts; includes UpgradeToR1Plates"}
  - {path: STLs/RPi_Zero_USB_Expander_Mount, required: false}
  - {path: STLs/Side_Skirt_with_Chain_Anchor, required: false, note: "REPLACES one stock skirt"}
  - {path: STLs/Slide_In_Nut_Support, required: false}
option_groups:
  - {id: picobilical, choose_one: ["include STLs/Picobilical_Toolhead", "omit"], note: "match to whether LDO-Picobilical addon is attached"}
naming_quirks:
  - "mix of .stl + .step + .f3d sources in same folders; spaces in some filenames ('DIN Screw Cleat_x2.stl')"
  - "kit revisions are branches (v01/v02/v02r1), not tags"
known_overlaps:
  - {with: Voron-0, note: "Power_Inlet and Side_Skirt_with_Chain_Anchor replace stock V0.2 parts"}
  - {with: LDO-Picobilical, note: "Picobilical_Toolhead mounts pair with that repo's PCB"}
