schema: print-partner/structure@1
source_name: Micron
ref_documented: main
stl_root: STLs/
folders:
  - {path: STLs/Frame, required: true}
  - {path: STLs/Gantry, required: true, note: "AB_Drives, Idlers, X_Axis, Z_Joints + [a]_klicky_gantry_dock.stl variants"}
  - {path: STLs/Z_Drive, required: true}
  - {path: STLs/Z_Idlers, required: true}
  - {path: STLs/Z_Chain, required: true}
  - {path: STLs/Electronics, required: true, note: "Controller_Mounts, PSU_Mounts, WAGO_Mounts subfolders"}
  - {path: STLs/Panels, required: true, note: "twist-lock panel system; bowden tube entry ECAS/M10 x MMU variants"}
  - {path: STLs/Skirts, required: true}
  - {path: STLs/Kit_Specific_Parts/LDO, required: false, note: "LDO Micron kit parts (cob mounts, lcp300 psu mount, nh36 usb adapter, skirt_fan_pcb)"}
  - {path: STLs/MISC, required: false}
  - {path: STLs/Tools, required: false}
  - {path: Mods/, required: false, note: "per-contributor mods (Kayos Maker, etc.)"}
option_groups:
  - {id: size, choose_one: ["120 (Micron)", "180 (Micron+)"], note: "size encoded in FILENAMES (120_/180_ prefixes), not folders"}
  - {id: bowden_entry, choose_one: [ECAS, M10], note: "x MMU / non-MMU variants"}
  - {id: probe_dock, choose_one: ["[a]_klicky_gantry_dock.stl", "[a]_klicky_gantry_probe_dock.stl", none]}
naming_quirks:
  - "size variants interleaved in same folders via 120_/180_ filename prefixes"
  - "[a]_ accents; _xN; extreme quantities like [a]_twist_lock_key_x50.stl"
known_overlaps:
  - {with: Voron-2, note: "design derived from V2.4; similar folder taxonomy (Z_Drive/Z_Idlers) — slug collisions likely"}
  - {with: Galileo2, note: "G2Z advertises Micron support"}
  - {with: West3D-Micron, note: "West3D supplements: BTT_TFT43 mount, ECAS bowden tube entry, skirt keystone"}
