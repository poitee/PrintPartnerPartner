schema: print-partner/structure@1
source_name: LDOVoron2
ref_documented: main
stl_root: STLs/
files_flat_with_f3d_sources: true   # each part: lowercase .stl + Title-case .f3d
parts:
  - {stl: STLs/plug_panel_1.2mm.stl, replaces: "Voron-2 plug panel", status: "deprecated as of V2.4R2 per STLs/README.md"}
  - {stl: STLs/nozzle_probe_ldo.stl, replaces: "Voron-2 STLs/Z_Endstop/nozzle_probe.stl", note: "for LDO Z Endstop PCB"}
  - {stl: STLs/cw2_offset_chain_anchor.stl, replaces: "SB chain anchor (remix with offset)"}
  - {stl: STLs/cw2_pcb_cover_for_captive_screw.stl}
  - {stl: STLs/handlebar_spacer_x4.stl, optional: true}
  - {stl: STLs/exhaust_cover.stl, optional: true, note: "for Nevermore internal filter builds"}
  - {stl: STLs/ldo_bestagon_insert.stl, optional: true, accent: true}
  - {stl: STLs/led_fan_pcb_spacer_x2.stl}
  - {stl: STLs/beefy_raspberry_bracket.stl, optional: true}
subfolders: [STLs/COB Light Strip, STLs/LDO Door, STLs/LDOSBCW2MountCover, STLs/Purge Bucket]
firmware: [octopus-printer-rev-a.cfg, octopus-printer-rev-c.cfg, leviathan-printer-rev-d.cfg, leviathan-printer-rev-d-sbv2.cfg]
option_groups:
  - {id: controller, choose_one: [octopus (rev A/C kits), leviathan (rev D kits)], note: "kit revision determines controller and mounts"}
naming_quirks: ["spaces in subfolder names; .f3d sources alongside stls; 'Z Belt Cover A LED.f3d' style Title Case"]
known_overlaps:
  - {with: Voron-2, note: "plug panel / nozzle_probe replacements; STLs/README links OLD V2.4r1-era upstream paths (STLs/VORON2.4/...)"}
  - {with: Voron-Stealthburner, note: "cw2_offset_chain_anchor and LDOSBCW2MountCover remix SB parts"}
