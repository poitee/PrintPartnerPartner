schema: print-partner/structure@1
source_name: chirpy2605-voron
ref_documented: main
stl_root: null   # mods grouped by printer family
folders:
  - {path: V0/Dragon_Burner, scope: "V0/PFA toolhead: 2x4010 part fans + 3010 hotend fan"}
  - {path: V0/Rapid_Burner, scope: "UHF hotends (Rapido UHF, Dragon UHF, Goliath)"}
  - {path: V0/Yavoth, scope: "high/ultra-high-flow toolhead"}
  - {path: V0/Mailbox | V0/NozzleWiper | V0/StovePipe | V0/TipTophat | V0/Tophat_Cat_Flap | V0/Lift-Off_Tophat_Hinges | V0/XCarriage_v0_2 | V0/v0.2_Stuff | V0/5015_Toolhead | V0/Daylight_on_a_Matchstick | V0/Rainbow_Dragon | V0/Dragon_Burner_Cutter, scope: "V0 mods"}
  - {path: general/Alternative_Voron_Mounts, scope: "mounts adapting Dragon/Rapid Burner to Trident, 2.4, Legacy, Switchwire, PFA"}
  - {path: general/*, scope: "misc mods (CraneFly, PCB_Mounts, RoundAbout/RoundHouse/RoundTrip, MiniMouse, Experimental, ...)"}
option_groups:
  - {id: toolhead, choose_one: [Dragon_Burner, Rapid_Burner, Yavoth, "..."], note: "one toolhead mod per stack"}
naming_quirks: ["per-mod folder READMEs; no tags; deep nesting per variant"]
known_overlaps:
  - {with: Voron-0 / Boop / Voron-Stealthburner, note: "Dragon Burner replaces the stock toolhead; mounts overlap SB/mini-SB slot"}
