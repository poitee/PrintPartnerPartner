schema: print-partner/structure@1
source_name: LDO-Milo-V1.5
ref_documented: master
stl_root: STLs/
folders:
  - {path: "STLs/Minimill Main", required: true, note: "space in dir name"}
  - {path: "STLs/Electronics Table", required: true, note: "many *_LDO suffixed parts (Mainboard Mount x1_LDO.stl etc.), .step alongside .stl"}
  - {path: STLs/Tools, required: false}
  - {path: STLs/PRINTED_PARTS.md, required: false, note: "authoritative print list — parse this"}
option_groups:
  - {id: vfd, choose_one: ["VFD Mount 110v", UNKNOWN_other_variants], note: "verify against PRINTED_PARTS.md"}
naming_quirks:
  - "spaces everywhere in dir/file names; double spaces in some ('IO Expander DIN Mount  x1_LDO.stl')"
  - "'x1' quantity embedded mid-name, not as _xN suffix"
  - "_LDO suffix marks kit-specific variants"
known_overlaps: []
