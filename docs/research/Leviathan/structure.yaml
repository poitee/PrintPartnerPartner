schema: print-partner/structure@1
source_name: Leviathan
ref_documented: master
stl_root: null   # NO printable STLs in this repo
folders:
  - {path: CAD/, required: false, note: "Leviathan_V1.2.step / V1.3.step board models"}
  - {path: Klipper_config/, required: false, note: "trident_leviathan.cfg, voron2_leviathan.cfg"}
  - {path: Manual/, required: false, note: "V1.2 and V1.3 PDFs"}
  - {path: KiCad/, required: false}
option_groups:
  - {id: board_revision, choose_one: [V1.2, V1.3], note: "manuals/CAD are revision-specific"}
naming_quirks: ["revision encoded in filenames, no git tags"]
known_overlaps: []
