schema: print-partner/structure@1
source_name: Voron-Stealthburner
ref_documented: main
stl_root: STLs/
folders:
  - {path: STLs/Stealthburner, required: true, note: "[a]_stealthburner_main_body.stl, [c]_LED_diffuser, [o]_LED_carrier/diffuser_mask"}
  - {path: STLs/Stealthburner/Printheads, required: true, note: "one subfolder per hotend"}
  - {path: STLs/Clockwork2, required: true, note: "extruder; Direct_Drive vs Bowden subfolders + chain anchors + cable doors"}
  - {path: STLs/Stealthburner/ADXL345_Mounts, required: false}
  - {path: STLs/Tools, required: false, note: "5015 cutting tools"}
option_groups:
  - id: printhead_hotend
    choose_one: [chube_compact, phaetus_bmo, phaetus_bms (bms6/bms7), phaetus_dragon, phaetus_rapido, phaetus_rapido_v2, revo_micro, revo_six_and_v6, revo_voron]
    note: "each folder has *_front.stl + *_rear_cw2.stl; some also *_rear_cw1.stl (phaetus_bmo, rapido_v2)"
  - id: extruder_generation
    choose_one: ["*_cw1.stl", "*_cw2.stl"]
    note: "rear printhead half must match Clockwork1 vs Clockwork2"
  - id: drive_mode
    choose_one: [STLs/Clockwork2/Direct_Drive, STLs/Clockwork2/Bowden]
  - id: chain_anchor
    choose_one: [chain_anchor_2hole.stl, chain_anchor_3hole.stl, chain_anchor_2hole_SW.stl, chain_anchor_3hole_SW.stl]
    note: "2hole/3hole must match base printer Z chain parts; _SW variants only for Switchwire"
naming_quirks:
  - "[a]_ accent, [o]_ opaque, [c]_ clear/translucent (documented in STLs/README.md)"
  - "_cw1/_cw2 = Clockwork generation; _SW = Switchwire variant"
  - "X carriage NOT here: 'The X Carriage files are in each printers repo'"
known_overlaps:
  - {with: Voron-Trident/Voron-2, note: "chain anchor hole-count pairs with printer z chain parts; carriage files live in printer repos"}
  - {with: Galileo2, note: "galileo2_extruder (G2E) is a drop-in REPLACEMENT for Clockwork2 rear"}
