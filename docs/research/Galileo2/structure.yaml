schema: print-partner/structure@1
source_name: Galileo2
ref_documented: main
stl_root: null   # three sub-projects, each with own stl dir (case varies!)
subprojects:
  - {id: G2E, path: galileo2_extruder/stl, status: RELEASE, note: "SB drop-in extruder; cable_chain_2_hole.stl vs cable_chain_3_hole.stl option"}
  - {id: G2SA, path: galileo2_standalone/STL, status: PUBLIC BETA, note: "UPPERCASE STL dir; orbiter2 vs sherpa_mini mount bodies; bowden/ subfolder with 1515 vs 2020 + 180-size variants"}
  - {id: G2Z, path: galileo2_z/stl, status: RELEASE, note: "Z drives for V2-style printers incl V2, Micron; filenames contain SPACES before xN: 'corner_left x2.stl'"}
option_groups:
  - {id: g2e_cable_chain, choose_one: [galileo2_extruder/stl/cable_chain_2_hole.stl, galileo2_extruder/stl/cable_chain_3_hole.stl]}
  - {id: g2e_coupler, choose_one: [galileo2_extruder/stl/front_body.stl, galileo2_extruder/stl/front_body_ECAS_coupler.stl]}
  - {id: g2sa_mount, choose_one: [main_body_orbiter2_mount_x1.stl, main_body_sherpa_mini_mount_x1.stl, "ECAS variants"]}
naming_quirks:
  - "stl vs STL directory case differs per subproject"
  - "G2Z files have a space before quantity: '[a]_corner_baseplate_left x2.stl'"
  - "user_mods/ per contributor"
known_overlaps:
  - {with: Voron-Stealthburner, note: "G2E REPLACES Clockwork2 (rear section); SB printhead fronts still used"}
  - {with: Voron-2 / Micron, note: "G2Z REPLACES STLs/Z_Drive parts"}
