schema: print-partner/structure@1
source_name: Voron-0
ref_documented: Voron0.2r1 (default branch)
stl_root: STLs/
folders:
  - {path: "STLs/ (root)", required: true, note: "frame/gantry parts sit FLAT in STLs root: A_Drive_Frame_*, B_Drive_Frame_*, XY_Joint_*, X_Carriage_x1.stl, bed mounts, [a]_ tensioners"}
  - {path: STLs/Toolheads, required: true, note: "Mini Stealthburner toolhead lives in-repo (unlike V2/Trident)"}
  - {path: STLs/Display, required: false}
  - {path: STLs/Electronics, required: true}
  - {path: STLs/Panel_Mounting, required: true}
  - {path: STLs/Skirts, required: true}
  - {path: STLs/Tophat, required: true}
  - {path: STLs/Tools, required: false}
  - {path: STLs/Multibody_STLs, required: false, note: "multi-body alternates (Cowling/Display/Skirts) — exclude when normal STLs selected"}
option_groups:
  - id: multibody_vs_single
    choose_one: ["STLs/<normal parts>", "STLs/Multibody_STLs/*"]
naming_quirks:
  - "flat root files instead of assembly folders"
  - "CamelCase part names with _xN; mixed .stl/.STL extension case (e.g. Spool_Holder_x1.STL)"
  - "[a]_ accent, [c]_ clear (Display diffuser)"
  - "STLs/Readme.md capital R"
known_overlaps:
  - {with: LDOVoron0, paths: "LDO adds/replaces: Power_Inlet (inlet foot), Side_Skirt_with_Chain_Anchor (replaces a stock skirt), Kirigami bed parts"}
  - {with: voron_0_pancake_board + LDO-Picobilical, note: "both are V0 toolhead/umbilical electronics mods"}
