schema: print-partner/structure@1
source_name: LDO-Picobilical
ref_documented: master
stl_root: STLs/
parts:
  - {stl: STLs/frame_cover_plate.stl}
  - {stl: STLs/toolhead_spacer.stl, for: "V0.1-era toolhead"}
  - {stl: STLs/toolhead_spacer_v02.stl, for: "V0.2 toolhead"}
klipper_config: Klipper_Configs/ldo-picobilical.cfg
option_groups:
  - {id: toolhead_spacer, choose_one: [STLs/toolhead_spacer.stl, STLs/toolhead_spacer_v02.stl]}
naming_quirks: [".f3d sources alongside stls; 'Toolhead Spacer V0.2.f3d' has spaces + dots"]
known_overlaps:
  - {with: LDOVoron0, note: "LDOVoron0 STLs/Picobilical_Toolhead has the strain-relief mounts for this PCB"}
  - {with: Voron-Hardware, note: "V0-Umbilical is the upstream ancestor — mutually exclusive"}
  - {with: voron_0_pancake_board, note: "alternative toolhead-board approach — mutually exclusive"}
